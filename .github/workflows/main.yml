name: Build AutoLoom Media Glasses IPA

on:
  workflow_dispatch:
  push:
    branches:
      - autoloom-glasses-next
      - autoloom-glasses-vNext
      - autoloom-glasses-jarvis-v1
    # The Windows PC companion has its own workflow (pc-companion.yml).
    paths-ignore:
      - "pc-companion/**"
      - ".github/workflows/pc-companion.yml"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    # Read-only token: this job runs third-party build code (Rust crates,
    # Swift packages, Xcode), so it must not be able to push anything. The
    # screenshots are pushed by the small publish job below.
    permissions:
      contents: read

    # Actions are pinned to commit SHAs (tags and branches can move).
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Show Xcode version
        run: |
          xcodebuild -version
          uname -m

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # "stable" branch on 2026-10-12
        with:
          toolchain: stable

      - name: Add iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          echo "RUSTC_VERSION_HASH=$(rustc -V | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      # Cargo judges path dependencies by file mtime, so a fresh checkout would
      # rebuild every vendored Codex crate on each run. The vendored tree is
      # never edited here and its content hash is part of the cache key, so a
      # fixed timestamp is safe. native/ keeps checkout times and always rebuilds.
      - name: Pin vendored source timestamps
        run: find vendor/codex -type f -exec touch -t 202601010000 {} +

      # The native bridge takes ~17 minutes from scratch. Its dependency
      # artifacts only change with Cargo.lock, the vendored tree, or the toolchain.
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/GlassifAICodexBridge/target
          key: rust-v3-${{ env.RUSTC_VERSION_HASH }}-${{ hashFiles('vendor/codex/codex-rs/**/Cargo.toml', 'vendor/codex/codex-rs/**/*.rs') }}-${{ hashFiles('native/GlassifAICodexBridge/Cargo.lock') }}
          restore-keys: |
            rust-v3-${{ env.RUSTC_VERSION_HASH }}-${{ hashFiles('vendor/codex/codex-rs/**/Cargo.toml', 'vendor/codex/codex-rs/**/*.rs') }}-
            rust-ios-host-${{ env.RUSTC_VERSION_HASH }}-
            rust-ios-${{ env.RUSTC_VERSION_HASH }}-

      - name: Build native Codex framework
        run: |
          chmod +x ./scripts/build-native.sh
          ./scripts/build-native.sh

      # Compiler errors are published as annotations, so they are visible on
      # the public run page (the raw log needs a signed-in GitHub account).
      - name: Build unsigned iPhone app (Debug and Release)
        run: |
          for configuration in Debug Release; do
            status=0
            xcodebuild \
              -project ios/GlassifAI.xcodeproj \
              -scheme GlassifAI \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AUTOLOOM_COMMIT_SHA="${GITHUB_SHA::12}" \
              -IDEBuildingContinueBuildingAfterErrors=YES \
              build > "build-$configuration.log" 2>&1 || status=$?
            tail -n 3 "build-$configuration.log"
            if [ "$status" -ne 0 ]; then
              grep -E ": error: |error: " "build-$configuration.log" | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -n 40 \
                | while IFS= read -r line; do echo "::error title=$configuration build::${line}"; done
              exit "$status"
            fi
          done

      - name: Create unsigned IPAs
        run: |
          for configuration in Debug Release; do
            rm -rf Payload
            mkdir -p Payload
            cp -R "build/Build/Products/${configuration}-iphoneos/GlassifAI.app" Payload/
            zip -qr "AutoLoomMediaGlasses-${configuration}-unsigned.ipa" Payload
          done
          ls -la *.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AutoLoomMediaGlasses-unsigned-IPAs
          path: AutoLoomMediaGlasses-*-unsigned.ipa
          retention-days: 30

      # A hung simulator must not hold the runner for six hours.
      - name: Unit tests (iOS Simulator)
        timeout-minutes: 45
        run: |
          chmod +x ./scripts/ci-unit-tests.sh
          ./scripts/ci-unit-tests.sh

      # Screenshots of the main screens (demo data, throwaway stores). This job
      # cannot push; the publish job below commits them to the ci-screenshots
      # branch as run-<id>-<sha>/<screen>.png for UI review without Xcode.
      - name: UI screenshots (Simulator)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          chmod +x ./scripts/ci-screenshots.sh
          ./scripts/ci-screenshots.sh

      # The license texts of the Rust crates compiled into the app, published
      # with the screenshots (logs/) so they can be bundled (JARVIS plan 1.16).
      - name: Rust crate license texts
        if: always()
        continue-on-error: true
        run: |
          mkdir -p screenshots/logs
          cargo metadata --manifest-path native/GlassifAICodexBridge/Cargo.toml --format-version 1 \
            --filter-platform aarch64-apple-ios > cargo-metadata.json
          python3 scripts/rust-license-texts.py cargo-metadata.json > screenshots/logs/rust-crate-licenses.txt
          echo "::notice title=Rust crate licenses::$(sed -n '2p' screenshots/logs/rust-crate-licenses.txt)"

      - name: Hand screenshots to the publish job
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3

      # Independent of the iOS tests: it runs even when that step failed
      # (phase 1c's simulator failure skipped it).
      - name: Native bridge unit tests (host)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --manifest-path native/GlassifAICodexBridge/Cargo.toml --lib 2>&1 | tee cargo-test.log
          passed="$(grep -E '^test .* [.][.][.] ok$' cargo-test.log | awk '{print $2}' | paste -sd ';' - | sed 's/;/; /g')"
          echo "::notice title=Rust unit tests::$(grep -E '^test result:' cargo-test.log | tail -n 1)"
          echo "::notice title=Passed Rust tests::${passed}"

  # The only job with a write token. It runs no project code: it downloads
  # the screenshot artifact and pushes it to the ci-screenshots branch (a
  # normal push, never a force push; that branch does not trigger CI).
  publish-screenshots:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-screenshots
          path: screenshots

      - name: Publish to the ci-screenshots branch
        if: steps.download.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          compgen -G "screenshots/*.png" >/dev/null || compgen -G "screenshots/logs/*" >/dev/null || exit 0
          RUN_DIR="run-${GITHUB_RUN_ID}-${GITHUB_SHA::7}"
          git init -q shots
          cd shots
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-screenshots 2>/dev/null; then
            git checkout -q -b ci-screenshots FETCH_HEAD
          else
            git checkout -q --orphan ci-screenshots
          fi
          mkdir -p "$RUN_DIR"
          cp ../screenshots/*.png "$RUN_DIR/" 2>/dev/null || true
          cp -R ../screenshots/logs "$RUN_DIR/" 2>/dev/null || true
          git add "$RUN_DIR"
          git -c user.name="autoloom-ci" -c user.email="autoloom-ci@users.noreply.github.com" \
            commit -q -m "Screenshots ${RUN_DIR} [skip ci]"
          git push -q origin ci-screenshots
          echo "::notice title=Screenshots published::branch ci-screenshots, folder ${RUN_DIR}"
