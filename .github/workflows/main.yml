name: Build AutoLoom Media Glasses IPA

on:
  workflow_dispatch:
  push:
    branches:
      - autoloom-glasses-next
      - autoloom-glasses-vNext
      - autoloom-glasses-jarvis-v1

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    # contents: write only to publish UI screenshots to the ci-screenshots
    # branch (never to the code branches).
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: |
          xcodebuild -version
          uname -m

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          echo "RUSTC_VERSION_HASH=$(rustc -V | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      # Cargo judges path dependencies by file mtime, so a fresh checkout would
      # rebuild every vendored Codex crate on each run. The vendored tree is
      # never edited here and its content hash is part of the cache key, so a
      # fixed timestamp is safe. native/ keeps checkout times and always rebuilds.
      - name: Pin vendored source timestamps
        run: find vendor/codex -type f -exec touch -t 202601010000 {} +

      # The native bridge takes ~17 minutes from scratch. Its dependency
      # artifacts only change with Cargo.lock, the vendored tree, or the toolchain.
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/GlassifAICodexBridge/target
          key: rust-v3-${{ env.RUSTC_VERSION_HASH }}-${{ hashFiles('vendor/codex/codex-rs/**/Cargo.toml', 'vendor/codex/codex-rs/**/*.rs') }}-${{ hashFiles('native/GlassifAICodexBridge/Cargo.lock') }}
          restore-keys: |
            rust-v3-${{ env.RUSTC_VERSION_HASH }}-${{ hashFiles('vendor/codex/codex-rs/**/Cargo.toml', 'vendor/codex/codex-rs/**/*.rs') }}-
            rust-ios-host-${{ env.RUSTC_VERSION_HASH }}-
            rust-ios-${{ env.RUSTC_VERSION_HASH }}-

      - name: Build native Codex framework
        run: |
          chmod +x ./scripts/build-native.sh
          ./scripts/build-native.sh

      # Compiler errors are published as annotations, so they are visible on
      # the public run page (the raw log needs a signed-in GitHub account).
      - name: Build unsigned iPhone app (Debug and Release)
        run: |
          for configuration in Debug Release; do
            status=0
            xcodebuild \
              -project ios/GlassifAI.xcodeproj \
              -scheme GlassifAI \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AUTOLOOM_COMMIT_SHA="${GITHUB_SHA::12}" \
              build > "build-$configuration.log" 2>&1 || status=$?
            tail -n 3 "build-$configuration.log"
            if [ "$status" -ne 0 ]; then
              grep -E ": error: |error: " "build-$configuration.log" | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -n 40 \
                | while IFS= read -r line; do echo "::error title=$configuration build::${line}"; done
              exit "$status"
            fi
          done

      - name: Create unsigned IPAs
        run: |
          for configuration in Debug Release; do
            rm -rf Payload
            mkdir -p Payload
            cp -R "build/Build/Products/${configuration}-iphoneos/GlassifAI.app" Payload/
            zip -qr "AutoLoomMediaGlasses-${configuration}-unsigned.ipa" Payload
          done
          ls -la *.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: AutoLoomMediaGlasses-unsigned-IPAs
          path: AutoLoomMediaGlasses-*-unsigned.ipa

      # A hung simulator must not hold the runner for six hours.
      - name: Unit tests (iOS Simulator)
        timeout-minutes: 45
        run: |
          chmod +x ./scripts/ci-unit-tests.sh
          ./scripts/ci-unit-tests.sh

      # Screenshots of the main screens (demo data, throwaway stores), pushed
      # to the ci-screenshots branch as run-<id>/<screen>.png for UI review
      # from a machine without Xcode. A normal push, never a force push; the
      # branch does not trigger this workflow.
      - name: UI screenshots (Simulator)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          chmod +x ./scripts/ci-screenshots.sh
          ./scripts/ci-screenshots.sh
          # Screenshots, or at least the launch logs and crash reports.
          compgen -G "screenshots/*.png" >/dev/null || compgen -G "screenshots/logs/*" >/dev/null || exit 0
          RUN_DIR="run-${GITHUB_RUN_ID}-${GITHUB_SHA::7}"
          SHOTS="$RUNNER_TEMP/shots"
          if git fetch -q origin ci-screenshots 2>/dev/null; then
            git worktree add -q "$SHOTS" FETCH_HEAD
            git -C "$SHOTS" switch -q -c ci-screenshots
          else
            git worktree add -q --detach "$SHOTS"
            git -C "$SHOTS" switch -q --orphan ci-screenshots
          fi
          mkdir -p "$SHOTS/$RUN_DIR"
          cp screenshots/*.png "$SHOTS/$RUN_DIR/" 2>/dev/null || true
          cp -R screenshots/logs "$SHOTS/$RUN_DIR/" 2>/dev/null || true
          git -C "$SHOTS" add "$RUN_DIR"
          git -C "$SHOTS" -c user.name="autoloom-ci" -c user.email="autoloom-ci@users.noreply.github.com" \
            commit -q -m "Screenshots ${RUN_DIR} [skip ci]"
          git -C "$SHOTS" push -q origin ci-screenshots
          echo "::notice title=Screenshots published::branch ci-screenshots, folder ${RUN_DIR}"

      - name: Native bridge unit tests (host)
        run: |
          set -o pipefail
          cargo test --manifest-path native/GlassifAICodexBridge/Cargo.toml --lib 2>&1 | tee cargo-test.log
          passed="$(grep -E '^test .* [.][.][.] ok$' cargo-test.log | awk '{print $2}' | paste -sd ';' - | sed 's/;/; /g')"
          echo "::notice title=Rust unit tests::$(grep -E '^test result:' cargo-test.log | tail -n 1)"
          echo "::notice title=Passed Rust tests::${passed}"
